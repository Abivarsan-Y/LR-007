name: Backend science

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-science:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.13.6
      - run: uv sync --project backend --extra dev --locked
      - run: uv run --project backend --locked python -m pytest backend/tests/ -q
      - run: uv run --project backend --locked python scripts/validate_fixtures.py
      - run: uv run --project backend --locked python -m unittest discover -s tests -v
