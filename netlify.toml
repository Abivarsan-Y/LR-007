[build]
  command = "npm --prefix frontend ci && npm --prefix frontend run build && npm --prefix frontend run verify:delivery"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "24"

# This deployment is a recorded-data frontend. Do not return the SPA as an API response.
[[redirects]]
  from = "/api/*"
  to = "/api-unavailable.json"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, max-age=0"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
