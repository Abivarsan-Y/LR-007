[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon-ops-backend"
version = "0.1.0"
description = "HORIZON OPS Lunar Landing Site Navigator scientific backend"
authors = [{ name = "HORIZON OPS Team" }]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pyproj>=3.5.0",
    "pydantic>=2.0.0"
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
